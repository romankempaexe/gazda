name: Nasadenie Cloudflare

# Gazda na Cloudflare Workers + D1 (priečinok cloudflare/).
# - pull request: testy a nasadenie na náhľad (worker „gazda-preview“, vlastná databáza)
# - push do main: testy, migrácie databázy a nasadenie (worker „gazda“)
# Bez nastavených secrets CLOUDFLARE_API_TOKEN a CLOUDFLARE_ACCOUNT_ID sa
# nasadenie len preskočí (návod v cloudflare/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  check:
    name: Testy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - name: Testy
        run: npm test
      - name: Skúšobné zostavenie
        run: npx wrangler deploy --dry-run --env="" --outdir "$RUNNER_TEMP/dist"

  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Náhľad' || 'Nasadenie' }}
    needs: check
    # Pull requesty z cudzích forkov nemajú prístup k secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: ${{ github.event_name == 'pull_request' && 'preview' || '' }}
      # Client ID z Google Cloud pre prihlásenie Google účtom (verejný údaj – GitHub premenná).
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
    steps:
      - name: Kontrola nastavení
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Chýbajú GitHub secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID – nasadenie preskočené (návod v cloudflare/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'

      - name: Databáza D1 (pri prvom nasadení sa vytvorí)
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/ensure-d1.mjs "$TARGET_ENV"

      - name: Migrácie databázy
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote --env="$TARGET_ENV"

      - name: Nasadenie
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::Chýba GitHub premenná GOOGLE_CLIENT_ID – prihlásenie Google účtom nebude fungovať (návod v cloudflare/README.md)."
          fi
          npx wrangler deploy --env="$TARGET_ENV" --var "GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID" | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          if [ -n "$url" ]; then
            echo "### Gazda ${TARGET_ENV:+(náhľad)}: $url" >> "$GITHUB_STEP_SUMMARY"
            # Nová adresa workers.dev môže byť dostupná až o chvíľu – nie je to chyba nasadenia.
            curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$url/api/health" \
              || echo "::warning::$url/api/health zatiaľ neodpovedá (nová adresa sa môže ešte šíriť)."
            echo
            if [ "$TARGET_ENV" = "preview" ]; then
              sleep 15
              curl -s -m 120 "$url/api/leaflets/debug" > "$RUNNER_TEMP/pages.json" || true
              echo "--- letáky: ohraničenia (diagnostika) ---"
              jq -c '.[] | {store, page, error, products: [.products[]? | [.name[0:25], .box]]}' "$RUNNER_TEMP/pages.json" || cat "$RUNNER_TEMP/pages.json"
              i=0
              for img in $(jq -r '.[].image // empty' "$RUNNER_TEMP/pages.json"); do
                i=$((i+1))
                curl -s -m 30 -H 'accept: image/jpeg' -o "$RUNNER_TEMP/p$i" "$img" || continue
                convert "$RUNNER_TEMP/p$i" -resize 300x -quality 60 "$RUNNER_TEMP/p$i.jpg" || continue
                echo "IMG$i $(identify -format '%wx%h' "$RUNNER_TEMP/p$i.jpg")"
                base64 -w 0 "$RUNNER_TEMP/p$i.jpg" | fold -w 2000 | sed "s/^/B64-$i /"
              done
            fi
          fi

