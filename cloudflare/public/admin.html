<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Gazda – správca</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #f4f6f3; --surface: #fff; --text: #0f172a; --muted: #64748b; --primary: #16a34a; --border: #e2e8f0; --danger: #dc2626; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1512; --surface: #18201c; --text: #e7efe9; --muted: #9aa8a0; --primary: #22c55e; --border: #2a352f; --danger: #f87171; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .card { background: var(--surface); border-radius: 20px; padding: 24px; width: 100%; max-width: 440px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
      label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
      input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border);
        background: transparent; color: inherit; font: inherit; }
      button { margin-top: 18px; width: 100%; padding: 12px; border: 0; border-radius: 999px; background: var(--primary);
        color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.6; }
      .result { margin-top: 18px; font-size: 14px; word-break: break-all; }
      .result a { color: var(--primary); font-weight: 600; }
      .error { color: var(--danger); }
    </style>
  </head>
  <body>
    <form class="card" id="f">
      <h1>Gazda – správca</h1>
      <p>Vytvorí osobný odkaz do Gazdu pre zadaný e-mail. Ak ho človek už mal, starý odkaz prestane fungovať.</p>
      <label for="adminKey">Heslo správcu</label>
      <input id="adminKey" type="password" autocomplete="current-password" required />
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required />
      <button id="submit">Vytvoriť odkaz</button>
      <div class="result" id="result" aria-live="polite"></div>
    </form>
    <script>
      const $ = (id) => document.getElementById(id);
      $('f').onsubmit = async (e) => {
        e.preventDefault();
        $('submit').disabled = true;
        $('result').textContent = '';
        try {
          const res = await fetch('/api/admin/link', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ adminKey: $('adminKey').value, email: $('email').value }),
          });
          const body = await res.json();
          if (body.error) throw new Error(body.error);
          const a = document.createElement('a');
          a.href = body.result.link;
          a.textContent = body.result.link;
          $('result').replaceChildren('Odkaz pre ' + body.result.email + ' (funguje ako heslo – posielaj ho len jemu): ', a);
        } catch (err) {
          $('result').innerHTML = '';
          const span = document.createElement('span');
          span.className = 'error';
          span.textContent = err.message || 'Nepodarilo sa spojiť so serverom.';
          $('result').append(span);
        } finally {
          $('submit').disabled = false;
        }
      };
    </script>
  </body>
</html>
