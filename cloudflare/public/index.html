<!DOCTYPE html>
<html lang="sk" data-app="family">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      // Family Grid sa otvára rovno v naposledy otvorenej podaplikácii;
      // rozcestník sa ukáže len po ťuknutí na tlačidlo dlaždíc (/?grid=1) alebo pri prvom spustení.
      (function () {
        var p = new URLSearchParams(location.search);
        var last = null;
        try {
          last = localStorage.getItem('fg.lastApp');
          // doterajší používateľ Gazdy (má v telefóne jej údaje) – otvor mu rovno Gazdu
          if (!last && localStorage.getItem('gazda.snap')) last = 'gazda';
          var t = localStorage.getItem('gazda.theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
        if (p.has('akcia')) location.replace('/gazda/' + location.search);
        else if (!p.has('grid') && location.hash !== '#kalendar' && /^(gazda|zdravko|skladko|quickstash)$/.test(last || '')) location.replace('/' + last + '/');
        else if (p.has('grid')) {
          window.FG_GRID = true; // rozcestník si človek vyžiadal – nepresmerovať
          history.replaceState(null, '', '/' + location.hash);
        }
      })();
    </script>
    <title>Family Grid</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/family/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/family/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/family/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Family Grid" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..500,0..1,0&amp;icon_names=add,brightness_auto,check_circle,close,content_copy,dark_mode,delete,edit,event,expand_more,group,group_add,light_mode,lock,logout,more_horiz,notifications,notifications_active,notifications_off,open_in_new,person,person_add,schedule,send,share,star,swap_horiz&amp;display=block"
    />
    <link rel="stylesheet" href="/shared/app.css" />
    <link rel="stylesheet" href="/shared/fg.css" />
  </head>
  <body>
    <header class="appbar">
      <span id="brand" class="brand"><img src="/icons/family/icon.svg" alt="Family Grid" /></span>
      <h1 id="title">Family Grid</h1>
      <button id="bellBtn" class="icon-btn hidden" title="Upozornenia">
        <span class="ms">notifications</span>
      </button>
      <button id="avatar" class="avatar hidden" title="Môj účet"></button>
    </header>

    <main id="view">
      <div class="center muted">Načítavam…</div>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-card" id="modalContent"></div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <div id="busy" class="busy hidden"><div class="spinner"></div></div>

    <script src="/shared/fg.js"></script>
    <script src="/grid.js"></script>
  </body>
</html>
