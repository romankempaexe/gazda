<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#16a34a" />
    <title>Gazda</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gazda" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..500,0..1,0&amp;icon_names=ac_unit,add,add_shopping_cart,air,alarm,apartment,arrow_back,arrow_forward,assignment_add,balcony,bathtub,bed,calendar_month,chair,check,check_box,check_box_outline_blank,check_circle,checklist,chevron_left,chevron_right,cleaning_services,close,construction,content_copy,delete,dinner_dining,dishwasher,done_all,door_front,eco,edit,edit_note,event,event_available,favorite,format_paint,garage,gesture,grass,group,handyman,history,home,home_repair_service,key,kitchen,lightbulb,list,local_laundry_service,location_on,lock,lock_open,mail,nature,newspaper,notes,notifications,notifications_active,notifications_off,opacity,palette,pan_tool,payments,person,person_off,plumbing,pool,precision_manufacturing,recycling,refresh,remove,remove_shopping_cart,repeat,replay,roofing,schedule,security,send,share,shopping_cart,stairs,star,storefront,task_alt,thermostat,undo,videocam,warning,wash,water_drop,wb_sunny,window,zoom_in,zoom_out&amp;display=block"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="appbar">
      <button id="backBtn" class="icon-btn hidden" title="Späť">
        <span class="ms">arrow_back</span>
      </button>
      <span id="brand" class="brand"><img src="/icons/icon.svg" alt="Gazda" /></span>
      <h1 id="title">Gazda</h1>
      <button id="bellBtn" class="icon-btn hidden" title="Upozornenia">
        <span class="ms">notifications</span>
      </button>
      <button id="avatar" class="avatar hidden" title="Môj účet"></button>
    </header>

    <main id="view">
      <div class="center muted">Načítavam…</div>
    </main>

    <nav id="tabs" class="bottom-nav hidden">
      <button data-tab="rozpis" class="tab active">
        <span class="ms">list</span><span>Môj rozpis</span>
        <span id="overdueBadge" class="badge hidden"></span>
      </button>
      <button data-tab="planovanie" class="tab">
        <span class="ms">calendar_month</span><span>Plánovanie</span>
      </button>
      <button data-tab="historia" class="tab">
        <span class="ms">history</span><span>História</span>
      </button>
    </nav>

    <div id="modal" class="modal hidden">
      <div class="modal-card" id="modalContent"></div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <div id="busy" class="busy hidden"><div class="spinner"></div></div>

    <script src="/produkty.js"></script>
    <script src="/app.js"></script>
    <script src="/letaky.js"></script>
  </body>
</html>
