<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Gazda</title>
    <style>
      :root { --bg: #f4f6f5; --surface: #fff; --text: #14201a; --muted: #5d6b64; --primary: #16a34a; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1512; --surface: #18201c; --text: #e7efe9; --muted: #9aa8a0; --primary: #22c55e; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .card { background: var(--surface); border-radius: 20px; padding: 28px 24px; max-width: 420px; width: 100%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); text-align: center; }
      .logo { font-size: 44px; }
      h1 { margin: 8px 0 4px; font-size: 24px; }
      p { margin: 0; color: var(--muted); }
      .status { margin-top: 18px; font-size: 14px; }
      .ok { color: var(--primary); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">🏠</div>
      <h1>Gazda</h1>
      <p>Nová verzia na Cloudflare sa pripravuje.</p>
      <div class="status" id="status">Kontrolujem server…</div>
    </div>
    <script>
      fetch('/api/health')
        .then((r) => r.json())
        .then((d) => {
          const el = document.getElementById('status');
          el.innerHTML = d.ok
            ? '<span class="ok">Server beží</span> · tabuliek v databáze: ' + d.tables.length
            : 'Server neodpovedá správne';
        })
        .catch(() => (document.getElementById('status').textContent = 'Server je nedostupný'));
    </script>
  </body>
</html>
