<!DOCTYPE html>
<html lang="sk" data-app="zdravko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1d72b8" />
    <script>
      try {
        var t = localStorage.getItem('gazda.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>Zdravko · Family Grid</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/zdravko/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/zdravko/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/family/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Family Grid" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..500,0..1,0&amp;icon_names=ac_unit,add,apps,arrow_back,bloodtype,brightness_auto,cake,calculate,calendar_month,check,check_circle,chevron_left,chevron_right,child_care,close,content_copy,dark_mode,delete,download,edit,event,expand_more,favorite,group,group_add,healing,history,light_mode,local_hospital,lock,logout,medical_services,medication,monitor_weight,more_horiz,more_vert,notes,notifications,notifications_active,notifications_off,open_in_new,payments,person,person_add,remove,schedule,send,share,show_chart,shower,spa,star,straighten,swap_horiz,sync,table_rows,thermometer,thermostat,timer,vaccines,warning,water_drop&amp;display=block"
    />
    <link rel="stylesheet" href="/shared/app.css" />
    <link rel="stylesheet" href="/shared/fg.css" />
    <link rel="stylesheet" href="/zdravko/zdravko.css" />
  </head>
  <body>
    <header class="appbar">
      <a id="gridBtn" class="icon-btn" href="/?grid=1" title="Family Grid – všetky aplikácie"><span class="ms">apps</span></a>
      <button id="backBtn" class="icon-btn hidden" title="Späť"><span class="ms">arrow_back</span></button>
      <span id="brand" class="brand"><img src="/icons/zdravko/icon.svg" alt="Zdravko" /></span>
      <h1 id="title">Zdravko</h1>
      <button id="bellBtn" class="icon-btn hidden" title="Upozornenia"><span class="ms">notifications</span></button>
      <button id="avatar" class="avatar hidden" title="Môj účet"></button>
    </header>

    <main id="view">
      <div class="center muted">Načítavam…</div>
    </main>

    <div id="fab" class="fab-bar hidden"></div>

    <nav id="tabs" class="bottom-nav hidden"></nav>

    <div id="modal" class="modal hidden">
      <div class="modal-card" id="modalContent"></div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <div id="busy" class="busy hidden"><div class="spinner"></div></div>

    <script src="/shared/fg.js"></script>
    <script src="/zdravko/data.js"></script>
    <script src="/zdravko/app.js"></script>
  </body>
</html>
